<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER BBS — 1990s Dial-Up Simulator</title>
  <link rel="stylesheet" href="assets/css/terminal.css">
  <link rel="stylesheet" href="assets/css/crt.css">
</head>
<body>
  <div id="viewport">
    <!-- Vintage CRT Monitor Chassis -->
    <div id="monitor-housing" class="aspect-4-3 theme-vga">
      <!-- Top Bezel / Header Controls -->
      <div class="monitor-top">
        <div class="brand-badge">
          <span class="logo-pill">CYBER BBS</span>
          <span>NODE 1 · 14.4k HST · 486DX2/66</span>
        </div>
        <div class="bezel-controls">
          <button type="button" id="btn-fullscreen" class="bezel-btn" aria-pressed="false" title="Toggle Full Screen (F11 / Alt+Enter)">⛶ FULL</button>
          <button type="button" id="btn-aspect" class="bezel-btn" aria-pressed="false" title="Toggle 4:3 / 16:9">📐 4:3</button>
          <button type="button" id="btn-mode" class="bezel-btn" title="Cycle Video Hardware Adapter (Alt+V / MODE)">📼 VGA 80x25</button>
          <button type="button" id="btn-crt" class="bezel-btn active" aria-pressed="true" title="Toggle CRT Scanlines">📺 CRT: ON</button>
          <button type="button" id="btn-theme" class="bezel-btn" title="Cycle Phosphor Theme">🎨 VGA COLOR</button>
          <button type="button" id="btn-skin" class="bezel-btn" title="Cycle Monitor Chassis">🖥️ CLASSIC PC</button>
          <button type="button" id="btn-pure" class="bezel-btn" title="Pure Bezel-Free 80x25 Terminal">⬜ PURE: OFF</button>
          <button type="button" id="btn-mute" class="bezel-btn active" aria-pressed="true" title="Mute/Unmute Audio">🔊 SOUND: ON</button>
        </div>
      </div>

      <!-- CRT Screen with Scanlines & Terminal Canvas -->
      <div id="crt-frame" class="scanlines vignette crt-curved">
        <canvas id="term-canvas" width="1440" height="800"></canvas>
        <div id="mouse-overlay"></div>
      </div>

      <!-- Bottom Hardware Panel: Courier 14.4k Modem LEDs & Volume -->
      <div class="monitor-bottom">
        <div class="modem-panel">
          <div class="modem-title">USRobotics COURIER 14400</div>
          <div class="led-group">
            <div class="modem-led"><span class="led-label">HS</span><div id="led-hs" class="led-light amber"></div></div>
            <div class="modem-led"><span class="led-label">AA</span><div id="led-aa" class="led-light green"></div></div>
            <div class="modem-led"><span class="led-label">CD</span><div id="led-cd" class="led-light green"></div></div>
            <div class="modem-led"><span class="led-label">OH</span><div id="led-oh" class="led-light red"></div></div>
            <div class="modem-led"><span class="led-label">RD</span><div id="led-rd" class="led-light green"></div></div>
            <div class="modem-led"><span class="led-label">SD</span><div id="led-sd" class="led-light amber"></div></div>
            <div class="modem-led"><span class="led-label">TR</span><div id="led-tr" class="led-light green on"></div></div>
            <div class="modem-led"><span class="led-label">MR</span><div id="led-mr" class="led-light green on"></div></div>
          </div>
        </div>

        <div class="system-status-panel">
          <div class="volume-control">
            <span>VOL</span>
            <input type="range" id="vol-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.75" title="Master Volume">
          </div>
          <div class="power-indicator">
            <div class="power-led"></div>
            <span>POWER</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden File Picker for Local Area 07 Uploads and Backups -->
  <input type="file" id="bbs-file-input" aria-label="Upload a file to the local BBS sandbox">
  <input type="file" id="bbs-json-input" accept=".json,application/json" aria-label="Import Forum or Full System Backup JSON">
  <div id="bbs-live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Core Scripts in Dependency Order -->
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/net.js"></script>
  <script src="assets/js/ansi.js"></script>
  <script src="assets/js/term.js"></script>
  <script src="assets/js/games.js"></script>
  <script src="assets/js/doors.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
