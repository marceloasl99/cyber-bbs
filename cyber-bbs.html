          forks_count: 280,
          language: 'Text',
          topics: ['bbs', 'textfiles', 'phreaking', 'history'],
          description: 'Historic digital collection of BBS text files, phreaking, and computing lore.'
        }
      ];
    }

    blinkLed(ledId, duration = 120) {
      const el = document.getElementById('led-' + ledId);
      if (!el) return;
      el.classList.add('on');
      setTimeout(() => el.classList.remove('on'), duration);
    }

    async fetchWithTimeout(url, opts = {}) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), this.timeoutMs);
      try {
        const response = await fetch(url, { ...opts, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    async fetchWithProxyChain(targetUrl, opts = {}) {
      this.blinkLed('sd', 200);

      for (let i = 0; i < this.proxyChain.length; i++) {
        const proxyFn = this.proxyChain[i];
        const requestUrl = proxyFn(targetUrl);
        try {
          const res = await this.fetchWithTimeout(requestUrl, opts);
          if (res.ok) {
            this.blinkLed('rd', 250);
            return res;
          }
        } catch (err) {}
      }

      this.blinkLed('sd', 80);
      throw new Error('NO CARRIER ON DATA LINK — PROXIES EXHAUSTED');
    }

    stripHtml(html) {
      if (!html) return '';
      const doc = new DOMParser().parseFromString(html, 'text/html');
      return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
    }

    /**
     * Primary Live RSS Fetcher: Uses CORS-safe rss2json API first for 100% reliable real news
     */
    async fetchRssFeed(feedUrl, sourceName) {
      this.blinkLed('sd', 150);

      // 1. Try rss2json (CORS friendly, returns real current news from today)
      try {
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
        const res = await this.fetchWithTimeout(apiUrl);
        if (res.ok) {
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            this.blinkLed('rd', 200);
            const items = data.items.map(item => ({
              source: sourceName || data.feed?.title || 'WIRE',
              title: this.stripHtml(item.title || 'Untitled'),
              link: item.link || '',
              date: (item.pubDate || new Date().toISOString()).substring(0, 16),
              summary: this.stripHtml(item.description || item.content || '')
            }));
            return { ok: true, items, isLive: true };
          }
        }
      } catch (e) {}

      // 2. Try raw XML with proxy fallback
      try {
        const res = await this.fetchWithProxyChain(feedUrl);
        const xml = await res.text();
        const items = this.parseFeedXml(xml, sourceName);
        if (items.length > 0) return { ok: true, items, isLive: true };
      } catch (e) {}

      // 3. Fallback to archive
      return {
        ok: true,
        items: this.archiveDigest,
        isLive: false,
        notice: '*** LIVE WIRE OFFLINE — SERVING ARCHIVE DIGEST ***'
      };
    }

    parseFeedXml(xmlText, sourceName) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, 'text/xml');
      const items = [];

      const rssItems = xml.querySelectorAll('item');
      if (rssItems && rssItems.length > 0) {
        rssItems.forEach(el => {
          const title = this.stripHtml(el.querySelector('title')?.textContent || 'Untitled');
          const link = el.querySelector('link')?.textContent || '';
          const pubDate = el.querySelector('pubDate')?.textContent || new Date().toISOString().substring(0, 10);
          const desc = this.stripHtml(el.querySelector('description')?.textContent || '');
          items.push({
            source: sourceName,
            title,
            link,
            date: pubDate.substring(0, 16),
            summary: desc.substring(0, 500)
          });
        });
        return items;
      }

      const atomEntries = xml.querySelectorAll('entry');
      if (atomEntries && atomEntries.length > 0) {
        atomEntries.forEach(el => {
          const title = this.stripHtml(el.querySelector('title')?.textContent || 'Untitled');
          const link = el.querySelector('link')?.getAttribute('href') || el.querySelector('link')?.textContent || '';
          const updated = el.querySelector('updated')?.textContent || new Date().toISOString().substring(0, 10);
          const summary = this.stripHtml(el.querySelector('summary')?.textContent || el.querySelector('content')?.textContent || '');
          items.push({
            source: sourceName,
            title,
            link,
            date: updated.substring(0, 10),
            summary: summary.substring(0, 500)
          });
        });
        return items;
      }

      return items;
    }

    // ==========================================
    // GITHUB INTEGRATION
    // ==========================================
    async searchGitHubRepos(query = 'retro computing', tag = '') {
      let q = query;
      if (tag) q += ` topic:${tag}`;
      const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&order=desc&per_page=20`;

      try {
        const res = await this.fetchWithProxyChain(url, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        const data = await res.json();
        if (data.items && data.items.length > 0) {
          return { ok: true, repos: data.items, isOffline: false };
        }
      } catch (err) {}

      let filtered = this.offlineRepos;
      if (tag) {
        filtered = this.offlineRepos.filter(r => r.topics.includes(tag.toLowerCase()));
      }
      return { ok: true, repos: filtered.length > 0 ? filtered : this.offlineRepos, isOffline: true };
    }

    async fetchRepoReadme(owner, repo) {
      const url = `https://api.github.com/repos/${owner}/${repo}/readme`;
      try {
        const res = await this.fetchWithProxyChain(url, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        const data = await res.json();
        if (data.content) {
          const decoded = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
          return this.formatMarkdownToText(decoded);
        }
      } catch (e) {}

      return `
  README: ${repo.toUpperCase()}
  ============================================================================
  This project is an open-source retro computing repository hosted on GitHub.
  Full documentation, build instructions, and release artifacts are available
  directly from the official repository archive.
  ============================================================================
      `;
    }

    async fetchRepoContents(owner, repo, path = '') {
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
      try {
        const res = await this.fetchWithProxyChain(url, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        const data = await res.json();
        if (Array.isArray(data)) {
          return data.map(item => ({
            name: item.name,
            type: item.type === 'dir' ? '<DIR>' : `${Math.ceil((item.size || 0) / 1024)}K`,
            size: item.size || 0,
            download_url: item.download_url
          }));
        }
      } catch (e) {}

      return [
        { name: 'src', type: '<DIR>', size: 0 },
        { name: 'docs', type: '<DIR>', size: 0 },
        { name: 'README.md', type: '4K', size: 4096 },
        { name: 'Makefile', type: '2K', size: 2048 },
        { name: 'LICENSE', type: '1K', size: 1024 }
      ];
    }

    formatMarkdownToText(md) {
      if (!md) return '';
      return md
        .replace(/\r\n/g, '\n')
        .replace(/^# (.*$)/gim, '\n  === $1 ===\n')
        .replace(/^## (.*$)/gim, '\n  --- $1 ---\n')
        .replace(/^### (.*$)/gim, '\n  * $1 *\n')
        .replace(/`{3}[\s\S]*?`{3}/g, (match) => match.replace(/`{3}/g, ''))
        .replace(/`([^`]+)`/g, '[$1]')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/\[(.*?)\]\((.*?)\)/g, '$1 ($2)');
    }

    // ==========================================
    // WIKIMEDIA IMAGE SEARCH
    // ==========================================
    async searchImages(query = 'vintage computer') {
      const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&prop=imageinfo&iiprop=url|size|extmetadata&format=json&origin=*`;
      try {
        const res = await this.fetchWithTimeout(url);
        const data = await res.json();
        const pages = data.query?.pages || {};
        const results = [];

        for (const id in pages) {
          const info = pages[id].imageinfo?.[0];
          if (info && info.url && (info.url.endsWith('.jpg') || info.url.endsWith('.png') || info.url.endsWith('.jpeg'))) {
            results.push({
              title: pages[id].title.replace(/^File:/, ''),
              url: info.url,
              thumbUrl: info.thumburl || info.url,
              width: info.width,
              height: info.height,
              license: info.extmetadata?.LicenseShortName?.value || 'Public Domain'
            });
          }
        }
        if (results.length > 0) return { ok: true, images: results };
      } catch (e) {}

      return {
        ok: true,
        images: [
          {
            title: 'IBM_Personal_Computer_5150.jpg',
            url: 'https://upload.wikimedia.org/wikipedia/commons/6/69/IBM_PC_5150.jpg',
            license: 'CC BY-SA 3.0',
            width: 640,
            height: 480
          },
          {
            title: 'Commodore_64_System.jpg',
            url: 'https://upload.wikimedia.org/wikipedia/commons/e/e9/Commodore-64-Computer-FL.jpg',
            license: 'CC BY 2.0',
            width: 640,
            height: 480
          }
        ],
        isOffline: true
      };
    }

    // ==========================================
    // WEATHER TELEMETRY
    // ==========================================
    async fetchWeather(city = 'New York') {
      try {
        const url = `https://wttr.in/${encodeURIComponent(city)}?ATm`;
        const res = await this.fetchWithProxyChain(url);
        const text = await res.text();
        if (text && text.length > 40) {
          return { ok: true, ansiText: text };
        }
      } catch (e) {}

      return {
        ok: true,
        asciiText: `
  WEATHER TELEMETRY REPORT: ${city.toUpperCase()}
  ==============================================================
  Local Sensor Reading: 19°C (66°F) · Humidity: 54% · Wind: 8 mph
  Conditions: Partially Overcast · Barometer: 1014 hPa (Steady)
  Satellite Link: Online · Optimal 14.4k line clarity.
  ==============================================================
        `
      };
    }
  }

  window.CyberBBS.Net = new BBSNet();
})();


/* --- assets/js/ansi.js --- */
/**
 * CYBER BBS — ANSI Engine & Image-to-ANSI Converter
 * Parses ANSI art, handles SAUCE records, and converts real images into
 * CP437 half-block ▀ ANSI graphics in 16 IBM VGA colors.
 */
(function() {
  window.CyberBBS = window.CyberBBS || {};

  class BBSAnsi {
    constructor() {
      // 16 IBM VGA Palette RGB definitions
      this.vgaPalette = [
        [0, 0, 0],       // 0: Black
        [0, 0, 170],     // 1: Blue
        [0, 170, 0],     // 2: Green
        [0, 170, 170],   // 3: Cyan
        [170, 0, 0],     // 4: Red
        [170, 0, 170],   // 5: Magenta
        [170, 85, 0],    // 6: Brown
        [170, 170, 170], // 7: Light Gray
        [85, 85, 85],    // 8: Dark Gray
        [85, 85, 255],   // 9: Bright Blue
        [85, 255, 85],   // 10: Bright Green
        [85, 255, 255],  // 11: Bright Cyan
        [255, 85, 85],   // 12: Bright Red
        [255, 85, 255],  // 13: Bright Magenta
        [255, 255, 85],  // 14: Yellow
        [255, 255, 255]  // 15: Bright White
      ];
    }

    /**
     * Map RGB to nearest VGA 16 color index (weighted perceptual distance)
     */
    rgbToNearestVga(r, g, b) {
      let bestIdx = 0;
      let minDistance = Infinity;

      for (let i = 0; i < this.vgaPalette.length; i++) {
        const [vr, vg, vb] = this.vgaPalette[i];
        // Weighted Euclidean distance (human eye is more sensitive to green)
        const dr = (r - vr) * 0.3;
        const dg = (g - vg) * 0.59;
        const db = (b - vb) * 0.11;
        const dist = dr * dr + dg * dg + db * db;

        if (dist < minDistance) {
          minDistance = dist;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    /**
     * Convert Image to ANSI CP437 Half-Block string
     * @param {string} imgUrl - Image source
     * @param {number} targetWidth - e.g. 78 or 80 columns
     * @param {number} targetHeight - e.g. 40 or 44 rows (produces 20 or 22 terminal lines)
     */
    async convertImageToAnsi(imgUrl, targetWidth = 78, targetHeight = 40) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';

        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');

            // Draw and downscale image
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, targetWidth, targetHeight);
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

            const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight).data;
            let ansi = '\x1b[0m';
            let lastFg = -1;
            let lastBg = -1;

            // Step 2 vertical pixels per character row using '▀'
            for (let y = 0; y < targetHeight; y += 2) {
              for (let x = 0; x < targetWidth; x++) {
                // Top pixel (Foreground of '▀')
                const idx1 = (y * targetWidth + x) * 4;
                const r1 = imgData[idx1], g1 = imgData[idx1 + 1], b1 = imgData[idx1 + 2];
                const fg = this.rgbToNearestVga(r1, g1, b1);

                // Bottom pixel (Background of '▀')
                const idx2 = ((y + 1) * targetWidth + x) * 4;
                const r2 = imgData[idx2], g2 = imgData[idx2 + 1], b2 = imgData[idx2 + 2];
                const bg = this.rgbToNearestVga(r2, g2, b2);

                if (fg !== lastFg || bg !== lastBg) {
                  // Emit SGR escape sequence
                  const fgCode = fg < 8 ? 30 + fg : 90 + (fg - 8);
                  const bgCode = bg < 8 ? 40 + bg : 100 + (bg - 8);
                  ansi += `\x1b[${fgCode};${bgCode}m`;
                  lastFg = fg;
                  lastBg = bg;
                }
                ansi += '▀';
              }
              ansi += '\x1b[0m\r\n';
              lastFg = -1;
              lastBg = -1;
            }

            resolve(ansi);
          } catch (err) {
            reject(err);
          }
        };

        img.onerror = (e) => reject(new Error('Failed to load image for ANSI conversion'));
        img.src = imgUrl;
      });
    }

    /**
     * Generate .ANS file Blob with SAUCE metadata
     */
    createAnsiBlob(ansiText, title = 'CYBER BBS ART', author = 'CYBER ARTIST') {
      const encoder = new TextEncoder();
      const textBytes = encoder.encode(ansiText);

      // Construct 128-byte SAUCE record
      const sauce = new Uint8Array(128);
      const sauceHeader = encoder.encode('SAUCE00');
      sauce.set(sauceHeader, 0);

      // Title (35 chars)
      const titleBytes = encoder.encode(title.padEnd(35, ' ').substring(0, 35));
      sauce.set(titleBytes, 7);

      // Author (20 chars)
      const authorBytes = encoder.encode(author.padEnd(20, ' ').substring(0, 20));
      sauce.set(authorBytes, 42);

      // Group (20 chars)
      const groupBytes = encoder.encode('CYBER BBS'.padEnd(20, ' '));
      sauce.set(groupBytes, 62);

      // Date YYYYMMDD (8 chars)
      const dateStr = new Date().toISOString().substring(0, 10).replace(/-/g, '');
      sauce.set(encoder.encode(dateStr), 82);

      // FileSize (4 bytes)
      const view = new DataView(sauce.buffer);
      view.setUint32(90, textBytes.length, true);

      // DataType: 1 (Character), FileType: 1 (ANS)
      sauce[94] = 1;
      sauce[95] = 1;
      view.setUint16(96, 80, true); // Width 80

      // Combined payload
      const combined = new Uint8Array(textBytes.length + 1 + 128);
      combined.set(textBytes, 0);
      combined[textBytes.length] = 0x1A; // EOF marker
      combined.set(sauce, textBytes.length + 1);

      return new Blob([combined], { type: 'text/plain' });
    }
  }

  window.CyberBBS.Ansi = new BBSAnsi();
})();


/* --- assets/js/term.js --- */
/**
 * CYBER BBS — Virtual Terminal Engine & CP437 High-Resolution Renderer
 * High-Definition 1440x800 internal canvas buffer, In-Terminal Interactive Input Prompt (Zero Browser Pop-ups),
 * 80x25 character matrix, ANSI parser, and Arrow Key Pre-Selection Bar.
 */
(function() {
  window.CyberBBS = window.CyberBBS || {};

  class BBSTerminal {
    constructor() {
      this.cols = 80;
      this.rows = 25;
      // High-Definition Canvas Geometry (2x resolution: 1440x800)
      this.cellWidth = 18;   // 80 * 18 = 1440px
      this.cellHeight = 32;  // 25 * 32 = 800px
      this.canvas = null;
      this.ctx = null;
      this.overlay = null;

      // Virtual Grid Buffer [row][col]
      this.buffer = [];
      this.cursor = { col: 0, row: 0, visible: true };
      this.currentFg = 7;
      this.currentBg = 0;
      this.bold = false;
      this.reverse = false;
      this.underline = false;

      // Interactive hit regions
      this.hitRegions = [];
      this.activeRegionIdx = -1;
      this.hoveredRegion = null;

      // Output queue & pacing
      this.outputQueue = [];
      this.isPacing = false;
      this.cps = 1440;
      this.pacingRaf = null;

      // In-Terminal Input Prompt state (No window.prompt!)
      this.activePrompt = null;

      // Notice message
      this.noticeText = '';
      this.noticeExpiry = 0;

      // Cursor blink timer
      this.cursorBlink = true;
      setInterval(() => {
        this.cursorBlink = !this.cursorBlink;
        if (this.activePrompt) {
          this.drawPromptBox();
        } else {
          this.renderCursor();
        }
      }, 500);

      this.initBuffer();
    }

    init(canvasId, overlayId) {
      this.canvas = document.getElementById(canvasId);
      this.overlay = document.getElementById(overlayId);
      if (!this.canvas) return;

      this.ctx = this.canvas.getContext('2d', { alpha: false });
      this.canvas.width = this.cols * this.cellWidth;
      this.canvas.height = this.rows * this.cellHeight;

      // Disable bilinear interpolation for crisp IBM VGA pixel font
      this.ctx.imageSmoothingEnabled = false;

      this.setupMouseEvents();

      // Trigger crisp redraw once embedded fonts are ready
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          this.redrawAll();
        });
      }

      this.redrawAll();
    }

    initBuffer() {
      this.buffer = [];
      for (let r = 0; r < this.rows; r++) {
        const row = [];
        for (let c = 0; c < this.cols; c++) {
          row.push({ ch: ' ', fg: 7, bg: 0, bold: false, reverse: false });
        }
        this.buffer.push(row);
      }
    }

    clear() {
      this.initBuffer();
      this.cursor.col = 0;
      this.cursor.row = 0;
      this.hitRegions = [];
      this.activeRegionIdx = -1;
      this.hoveredRegion = null;
      this.redrawAll();
    }

    setCursor(col, row) {
      this.cursor.col = Math.max(0, Math.min(this.cols - 1, col));
      this.cursor.row = Math.max(0, Math.min(this.rows - 1, row));
    }

    setColor(fg, bg) {
      if (fg !== undefined && fg !== null) this.currentFg = fg;
      if (bg !== undefined && bg !== null) this.currentBg = bg;
    }

    addHitRegion(col, row, width, height, id, action, label = '', numKey = null) {
      const region = {
        col, row, width, height,
        id, action, label,
        numKey: numKey !== null ? String(numKey).toUpperCase() : null,
        idx: this.hitRegions.length
      };
      this.hitRegions.push(region);
      return region;
    }

    clearHitRegions() {
      this.hitRegions = [];
      this.activeRegionIdx = -1;
      this.hoveredRegion = null;
    }

    selectNextRegion(forward = true) {
      if (this.hitRegions.length === 0) return;
      if (this.activeRegionIdx === -1) {
        this.activeRegionIdx = forward ? 0 : this.hitRegions.length - 1;
      } else if (forward) {
        this.activeRegionIdx = (this.activeRegionIdx + 1) % this.hitRegions.length;
      } else {
        this.activeRegionIdx = (this.activeRegionIdx - 1 + this.hitRegions.length) % this.hitRegions.length;
      }

      const region = this.hitRegions[this.activeRegionIdx];
      this.hoveredRegion = region;
      this.highlightRegion(region);
      if (window.CyberBBS.Audio) window.CyberBBS.Audio.playKeyClick();
    }

    triggerByNumKey(key) {
      const target = String(key).toUpperCase();
      const region = this.hitRegions.find(r => r.numKey === target);
      if (region && typeof region.action === 'function') {
        this.activeRegionIdx = region.idx;
        this.hoveredRegion = region;
        this.highlightRegion(region);
        if (window.CyberBBS.Audio) window.CyberBBS.Audio.playKeyClick();
        region.action();
        return true;
      }
      return false;
    }

    activateCurrentRegion() {
      if (this.activeRegionIdx >= 0 && this.activeRegionIdx < this.hitRegions.length) {
        const region = this.hitRegions[this.activeRegionIdx];
        if (typeof region.action === 'function') {
          if (window.CyberBBS.Audio) window.CyberBBS.Audio.playKeyClick();
          region.action();
          return true;
        }
      }
      return false;
    }

    highlightRegion(region) {
      this.redrawAll();
      if (!region) return;

      const x = region.col * this.cellWidth;
      const y = region.row * this.cellHeight;
      const w = region.width * this.cellWidth;
      const h = region.height * this.cellHeight;

      this.ctx.strokeStyle = '#FFFF55';
      this.ctx.lineWidth = 2;
      this.ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

      // Draw indicator '►' at left cell if space allows
      if (region.col > 0) {
        this.drawBoxGlyph('►', (region.col - 1) * this.cellWidth, y, this.cellWidth, this.cellHeight, '#FFFF55');
      }
    }

    setupMouseEvents() {
      if (!this.overlay) return;

      const getColRow = (e) => {
        const rect = this.canvas.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        const x = clientX * scaleX;
        const y = clientY * scaleY;
        const col = Math.floor(x / this.cellWidth);
        const row = Math.floor(y / this.cellHeight);
        return { col, row };
      };

      this.overlay.addEventListener('mousemove', (e) => {
        if (this.activePrompt) return;
        const { col, row } = getColRow(e);
        let found = null;
        for (const r of this.hitRegions) {
          if (col >= r.col && col < r.col + r.width && row >= r.row && row < r.row + r.height) {
            found = r;
            break;
          }
        }

        if (found !== this.hoveredRegion) {
          this.hoveredRegion = found;
          if (found) {
            this.activeRegionIdx = found.idx;
            this.overlay.style.cursor = 'pointer';
            this.highlightRegion(found);
          } else {
            this.overlay.style.cursor = 'default';
            this.redrawAll();
          }
        }
      });

      this.overlay.addEventListener('click', (e) => {
        if (this.isPacing) {
          this.skipPacing();
          return;
        }
        if (this.activePrompt) return;

        const { col, row } = getColRow(e);
        for (const r of this.hitRegions) {
          if (col >= r.col && col < r.col + r.width && row >= r.row && row < r.row + r.height) {
            if (window.CyberBBS.Audio) window.CyberBBS.Audio.playKeyClick();
            if (typeof r.action === 'function') {
              r.action();
            }
            break;
          }
        }
      });
    }

    putChar(ch, fg, bg) {
      if (this.cursor.col >= this.cols) {
        this.cursor.col = 0;
        this.cursor.row++;
      }
      if (this.cursor.row >= this.rows - 1) {
        this.scrollUp();
        this.cursor.row = this.rows - 2;
      }

      const effectiveFg = this.reverse ? (bg !== undefined ? bg : this.currentBg) : (fg !== undefined ? fg : this.currentFg);
      const effectiveBg = this.reverse ? (fg !== undefined ? fg : this.currentFg) : (bg !== undefined ? bg : this.currentBg);

      this.buffer[this.cursor.row][this.cursor.col] = {
        ch,
        fg: effectiveFg,
        bg: effectiveBg,
        bold: this.bold,
        reverse: this.reverse
      };

      this.drawCell(this.cursor.col, this.cursor.row);
      this.cursor.col++;
    }

    scrollUp() {
      for (let r = 0; r < this.rows - 2; r++) {
        this.buffer[r] = this.buffer[r + 1];
      }
      const blankRow = [];
      for (let c = 0; c < this.cols; c++) {
        blankRow.push({ ch: ' ', fg: 7, bg: 0, bold: false, reverse: false });
      }
      this.buffer[this.rows - 2] = blankRow;
      this.redrawAll();
    }

    print(text, fg, bg) {
      if (fg !== undefined) this.currentFg = fg;
      if (bg !== undefined) this.currentBg = bg;

      let i = 0;
      while (i < text.length) {
        const char = text[i];

        if (char === '\x1b' && text[i + 1] === '[') {
          let j = i + 2;
          while (j < text.length && !/[a-zA-Z]/.test(text[j])) j++;
          if (j < text.length) {
            const seq = text.substring(i + 2, j);
            const cmd = text[j];
            this.handleAnsi(seq, cmd);
            i = j + 1;
            continue;
          }
        }

        if (char === '\r') {
          this.cursor.col = 0;
        } else if (char === '\n') {
          this.cursor.col = 0;
          this.cursor.row++;
          if (this.cursor.row >= this.rows - 1) {
            this.scrollUp();
            this.cursor.row = this.rows - 2;
          }
        } else if (char === '\t') {
          this.cursor.col = (Math.floor(this.cursor.col / 8) + 1) * 8;
        } else if (char === '\b') {
          if (this.cursor.col > 0) this.cursor.col--;
        } else {
          this.putChar(char, this.currentFg, this.currentBg);
        }
        i++;
      }
    }

    println(text, fg, bg) {
      this.print(text + '\r\n', fg, bg);
    }

    handleAnsi(paramsStr, cmd) {
      const params = paramsStr.split(';').map(n => parseInt(n, 10) || 0);

      if (cmd === 'm') {
        if (paramsStr === '' || params[0] === 0) {
          this.currentFg = 7;
          this.currentBg = 0;
          this.bold = false;
          this.reverse = false;
          return;
        }
        for (let p of params) {
          if (p === 1) this.bold = true;
          else if (p === 7) this.reverse = true;
          else if (p >= 30 && p <= 37) this.currentFg = (this.bold ? p - 30 + 8 : p - 30);
          else if (p >= 40 && p <= 47) this.currentBg = p - 40;
          else if (p >= 90 && p <= 97) this.currentFg = p - 90 + 8;
          else if (p >= 100 && p <= 107) this.currentBg = p - 100 + 8;
        }
      } else if (cmd === 'H' || cmd === 'f') {
        const r = (params[0] || 1) - 1;
        const c = (params[1] || 1) - 1;
        this.setCursor(c, r);
      } else if (cmd === 'J') {
        if (params[0] === 2) this.clear();
      } else if (cmd === 'K') {
        for (let c = this.cursor.col; c < this.cols; c++) {
          this.buffer[this.cursor.row][c] = { ch: ' ', fg: 7, bg: 0, bold: false, reverse: false };
        }
        this.redrawRow(this.cursor.row);
      }
    }

    writePaced(text, onComplete) {
      this.outputQueue = text.split('');
      this.isPacing = true;

      const charsPerFrame = Math.max(2, Math.floor(this.cps / 60));
      const step = () => {
        if (!this.isPacing || this.outputQueue.length === 0) {
          this.isPacing = false;
          if (typeof onComplete === 'function') onComplete();
          return;
        }

        let chunk = '';
        for (let i = 0; i < charsPerFrame && this.outputQueue.length > 0; i++) {
          chunk += this.outputQueue.shift();
        }
        this.print(chunk);
        this.pacingRaf = requestAnimationFrame(step);
      };

      step();
    }

    skipPacing() {
      if (!this.isPacing) return;
      this.isPacing = false;
      if (this.pacingRaf) cancelAnimationFrame(this.pacingRaf);
      const remaining = this.outputQueue.join('');
      this.outputQueue = [];
      this.print(remaining);
      this.redrawAll();
    }

    showNotice(text, durationMs = 3500) {
      this.noticeText = text;
      this.noticeExpiry = Date.now() + durationMs;
      this.renderStatusBar();
    }

    renderStatusBar() {
      const store = window.CyberBBS.Store;
      const user = store ? store.currentUser : null;
      const handle = user ? user.handle : 'GUEST';
      const timeLeft = store ? store.getTimeRemainingFormatted() : '30:00';
      const credits = user ? user.credits : 500;
      const ratio = store ? store.getRatio() : '1:3';

      let text = '';
      if (this.noticeText && Date.now() < this.noticeExpiry) {
        text = ` ${this.noticeText.padEnd(78, ' ')} `;
      } else {
        const left = ` NODE 1 · 14.4k · ${handle} · TIME: ${timeLeft} · CR: ${credits} · RATIO: ${ratio}`;
        const right = `[F11:FULL] [M:MUTE] [ESC:BACK] `;
        text = (left.padEnd(79 - right.length, ' ') + right).substring(0, 80);
      }

      for (let c = 0; c < 80; c++) {
        this.buffer[24][c] = {
          ch: text[c] || ' ',
          fg: 0,
          bg: 3,
          bold: true,
          reverse: false
        };
        this.drawCell(c, 24);
      }

      this.addHitRegion(50, 24, 10, 1, 'btn-fs', () => window.CyberBBS.App.toggleFullscreen(), 'Fullscreen');
      this.addHitRegion(61, 24, 8, 1, 'btn-mute', () => window.CyberBBS.App.toggleMute(), 'Mute');
      this.addHitRegion(70, 24, 10, 1, 'btn-back', () => window.CyberBBS.App.goBack(), 'Back');
    }

    drawCell(col, row) {
      if (!this.ctx) return;
      const cell = this.buffer[row][col];
      const x = col * this.cellWidth;
      const y = row * this.cellHeight;
      const w = this.cellWidth;
      const h = this.cellHeight;

      // 1. Draw cell background
      this.ctx.fillStyle = this.getPaletteColor(cell.bg);
      this.ctx.fillRect(x, y, w, h);

      if (!cell.ch || cell.ch === ' ') return;

      const fgColor = this.getPaletteColor(cell.fg);

      // 2. Procedural rendering for all box-drawing, block, and UI symbol characters (100% gapless)
      if (this.isBoxOrBlockChar(cell.ch)) {
        this.drawBoxGlyph(cell.ch, x, y, w, h, fgColor);
        return;
      }

      // 3. Crisp character rendering with authentic IBM VGA font (32px matching 18x32 cell)
      this.ctx.fillStyle = fgColor;
      this.ctx.font = '32px "Px437_IBM_VGA9", "Px437_IBM_VGA8", "Consolas", monospace';
      this.ctx.textAlign = 'center';
      this.ctx.textBaseline = 'middle';
      this.ctx.fillText(cell.ch, x + w / 2, y + h / 2);
    }

    renderCursor() {
      if (!this.ctx || !this.cursor.visible) return;
      const x = this.cursor.col * this.cellWidth;
      const y = this.cursor.row * this.cellHeight;

      if (this.cursorBlink) {
        this.ctx.fillStyle = this.getPaletteColor(14);
        this.ctx.fillRect(x, y + this.cellHeight - 6, this.cellWidth, 4);
      } else {
        this.drawCell(this.cursor.col, this.cursor.row);
      }
    }

    redrawRow(row) {
      for (let c = 0; c < this.cols; c++) this.drawCell(c, row);
    }

    redrawAll() {
      if (!this.ctx) return;
      this.ctx.fillStyle = '#000000';
      this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          this.drawCell(c, r);
        }
      }
      if (this.activePrompt) {
        this.drawPromptBox();
      } else {
        this.renderCursor();
      }
    }

    // ==========================================
    // IN-TERMINAL INTERACTIVE INPUT PROMPT (NO POP-UPS!)
    // ==========================================
    promptInline(title, promptLabel, defaultVal = '', onSubmit, onCancel, isMasked = false) {
      this.activePrompt = {
        title,
        label: promptLabel,
        value: String(defaultVal || ''),
        isMasked: !!isMasked,
        onSubmit,
        onCancel
      };
      this.drawPromptBox();
    }

    drawPromptBox() {
      if (!this.ctx || !this.activePrompt) return;
      const p = this.activePrompt;

      const boxCols = 64;
      const boxRows = 7;
      const startCol = Math.floor((this.cols - boxCols) / 2);
      const startRow = 8;

      const px = startCol * this.cellWidth;
      const py = startRow * this.cellHeight;
      const pw = boxCols * this.cellWidth;
      const ph = boxRows * this.cellHeight;

      // Dark blue dialog background with cyan border
      this.ctx.fillStyle = '#000088';
      this.ctx.fillRect(px, py, pw, ph);

      this.ctx.strokeStyle = '#55FFFF';
      this.ctx.lineWidth = 3;
      this.ctx.strokeRect(px + 1.5, py + 1.5, pw - 3, ph - 3);

      this.ctx.font = '28px "Px437_IBM_VGA9", "Px437_IBM_VGA8", "Consolas", monospace';
      this.ctx.textBaseline = 'top';
      this.ctx.textAlign = 'left';

      // Title bar
      this.ctx.fillStyle = '#55FFFF';
      this.ctx.fillText(`──[ ${p.title.toUpperCase()} ]──`, px + 24, py + 14);

      // Label
      this.ctx.fillStyle = '#FFFFFF';
      this.ctx.fillText(p.label, px + 24, py + 52);

      // Input field box (black background)
      const fieldX = px + 24;
      const fieldY = py + 88;
      const fieldW = pw - 48;
      const fieldH = 38;

      this.ctx.fillStyle = '#000000';
      this.ctx.fillRect(fieldX, fieldY, fieldW, fieldH);
      this.ctx.strokeStyle = '#FFFF55';
      this.ctx.lineWidth = 1.5;
      this.ctx.strokeRect(fieldX, fieldY, fieldW, fieldH);

      // Typed value
      this.ctx.fillStyle = '#FFFF55';
      const displayVal = p.isMasked ? '•'.repeat(p.value.length) : p.value;
      this.ctx.fillText('> ' + displayVal, fieldX + 8, fieldY + 4);

      // Blinking cursor inside input
      if (this.cursorBlink) {
        const textMetrics = this.ctx.measureText('> ' + displayVal);
        this.ctx.fillStyle = '#FFFF55';
        this.ctx.fillRect(fieldX + 10 + textMetrics.width, fieldY + 6, 12, 26);
      }

      // Footer hint
      this.ctx.fillStyle = '#AAAAAA';
      this.ctx.font = '20px "Px437_IBM_VGA9", "Px437_IBM_VGA8", "Consolas", monospace';
      this.ctx.fillText('[ENTER] Confirm      [ESC] Cancel', px + 24, py + 160);
    }

    handlePromptKey(e) {
      if (!this.activePrompt) return false;
      const p = this.activePrompt;

      if (e.key === 'Enter') {
        const val = p.value.trim();
        const callback = p.onSubmit;
        this.activePrompt = null;
        this.redrawAll();
        if (typeof callback === 'function') callback(val);
        return true;
      }

      if (e.key === 'Escape') {
        const cancelCb = p.onCancel;
        this.activePrompt = null;
        this.redrawAll();
        if (typeof cancelCb === 'function') cancelCb();
        return true;
      }

      if (e.key === 'Backspace') {
        p.value = p.value.slice(0, -1);
        this.drawPromptBox();
        if (window.CyberBBS.Audio) window.CyberBBS.Audio.playKeyClick();
        return true;
      }

      if (e.key.length === 1 && !e.ctrlKey && !e.altKey) {
        if (p.value.length < 52) {
          p.value += e.key;
          this.drawPromptBox();
          if (window.CyberBBS.Audio) window.CyberBBS.Audio.playKeyClick();
        }
        return true;
      }

      return true;
    }

    isBoxOrBlockChar(ch) {
      if (!ch || ch.length !== 1) return false;
      const code = ch.charCodeAt(0);
      if (code >= 0x2500 && code <= 0x259F) return true;
      if (ch === '►' || ch === '◄' || ch === '▲' || ch === '▼' || ch === '■' || ch === '•' || ch === '▪' || ch === '▫') return true;
      return false;
    }

    drawBoxGlyph(ch, x, y, w, h, color) {
      const ctx = this.ctx;
      ctx.fillStyle = color;
      const cx = Math.floor(w / 2);
      const cy = Math.floor(h / 2);
      const lw = 2;
      const lx = x + cx - Math.floor(lw / 2);
      const ly = y + cy - Math.floor(lw / 2);

      // 1. Solid & Half Blocks
      if (ch === '█') { ctx.fillRect(x, y, w, h); return; }
      if (ch === '▀') { ctx.fillRect(x, y, w, cy); return; }
      if (ch === '▄') { ctx.fillRect(x, y + cy, w, h - cy); return; }
      if (ch === '▌') { ctx.fillRect(x, y, cx, h); return; }
      if (ch === '▐') { ctx.fillRect(x + cx, y, w - cx, h); return; }

      // 2. Shading Elements
      if (ch === '░' || ch === '▒' || ch === '▓') {
        for (let py = 0; py < h; py += 2) {
          for (let px = 0; px < w; px += 2) {
            const pattern = ((px + py) / 2) % 2 === 0;
            if (ch === '▒' && pattern) {
              ctx.fillRect(x + px, y + py, 2, 2);
            } else if (ch === '░' && px % 4 === 0 && py % 4 === 0) {
              ctx.fillRect(x + px, y + py, 2, 2);
            } else if (ch === '▓' && (pattern || px % 4 === 0)) {
              ctx.fillRect(x + px, y + py, 2, 2);
            }
          }
        }
        return;
      }

      // 3. Single-line Box Drawing
      if (ch === '─') { ctx.fillRect(x, ly, w, lw); return; }
      if (ch === '│') { ctx.fillRect(lx, y, lw, h); return; }
      if (ch === '┌') { ctx.fillRect(lx, ly, w - cx + 1, lw); ctx.fillRect(lx, ly, lw, h - cy + 1); return; }
      if (ch === '┐') { ctx.fillRect(x, ly, cx + 1, lw); ctx.fillRect(lx, ly, lw, h - cy + 1); return; }
      if (ch === '└') { ctx.fillRect(lx, ly, w - cx + 1, lw); ctx.fillRect(lx, y, lw, cy + 1); return; }
      if (ch === '┘') { ctx.fillRect(x, ly, cx + 1, lw); ctx.fillRect(lx, y, lw, cy + 1); return; }
      if (ch === '├') { ctx.fillRect(lx, y, lw, h); ctx.fillRect(lx, ly, w - cx + 1, lw); return; }
      if (ch === '┤') { ctx.fillRect(lx, y, lw, h); ctx.fillRect(x, ly, cx + 1, lw); return; }
      if (ch === '┬') { ctx.fillRect(x, ly, w, lw); ctx.fillRect(lx, ly, lw, h - cy + 1); return; }
      if (ch === '┴') { ctx.fillRect(x, ly, w, lw); ctx.fillRect(lx, y, lw, cy + 1); return; }
      if (ch === '┼') { ctx.fillRect(x, ly, w, lw); ctx.fillRect(lx, y, lw, h); return; }

      // 4. Double-line Box Drawing
      const y1 = ly - 3, y2 = ly + 3;
      const x1 = lx - 3, x2 = lx + 3;
      if (ch === '═') { ctx.fillRect(x, y1, w, lw); ctx.fillRect(x, y2, w, lw); return; }
      if (ch === '║') { ctx.fillRect(x1, y, lw, h); ctx.fillRect(x2, y, lw, h); return; }
      if (ch === '╔') {
        ctx.fillRect(x1, y1, w - (cx - 3), lw); ctx.fillRect(x2, y2, w - (cx + 3), lw);
        ctx.fillRect(x1, y1, lw, h - (cy - 3)); ctx.fillRect(x2, y2, lw, h - (cy + 3));
        return;
      }
      if (ch === '╗') {
        ctx.fillRect(x, y1, cx + 3, lw); ctx.fillRect(x, y2, cx - 1, lw);
        ctx.fillRect(x2, y1, lw, h - (cy - 3)); ctx.fillRect(x1, y2, lw, h - (cy + 3));
        return;
      }
      if (ch === '╚') {
        ctx.fillRect(x1, y, lw, cy + 5); ctx.fillRect(x2, y, lw, cy - 1);
        ctx.fillRect(x1, y2, w - (cx - 3), lw); ctx.fillRect(x2, y1, w - (cx + 3), lw);
        return;
      }
      if (ch === '╝') {
        ctx.fillRect(x1, y, lw, cy - 1); ctx.fillRect(x2, y, lw, cy + 5);
        ctx.fillRect(x, y1, cx - 1, lw); ctx.fillRect(x, y2, cx + 5, lw);
        return;
      }
      if (ch === '╠') {
        ctx.fillRect(x1, y, lw, h);
        ctx.fillRect(x2, y, lw, cy - 1);
        ctx.fillRect(x2, y + cy + 5, lw, h - (cy + 5));
        ctx.fillRect(x2, y1, w - (cx + 3), lw);
        ctx.fillRect(x2, y2, w - (cx + 3), lw);
        return;
      }
      if (ch === '╣') {
        ctx.fillRect(x2, y, lw, h);
        ctx.fillRect(x1, y, lw, cy - 1);
        ctx.fillRect(x1, y + cy + 5, lw, h - (cy + 5));
        ctx.fillRect(x, y1, cx - 1, lw);
        ctx.fillRect(x, y2, cx - 1, lw);
        return;
      }
      if (ch === '╦') {
        ctx.fillRect(x, y1, w, lw);
        ctx.fillRect(x, y2, cx - 1, lw);
        ctx.fillRect(x + cx + 5, y2, w - (cx + 5), lw);
        ctx.fillRect(x1, y2, lw, h - (cy + 3));
        ctx.fillRect(x2, y2, lw, h - (cy + 3));
        return;
      }
      if (ch === '╩') {
        ctx.fillRect(x, y2, w, lw);
        ctx.fillRect(x, y1, cx - 1, lw);
        ctx.fillRect(x + cx + 5, y1, w - (cx + 5), lw);
        ctx.fillRect(x1, y, lw, cy - 1);
        ctx.fillRect(x2, y, lw, cy - 1);
        return;
      }
      if (ch === '╬') {
        ctx.fillRect(x, y1, cx - 1, lw); ctx.fillRect(x + cx + 5, y1, w - (cx + 5), lw);
        ctx.fillRect(x, y2, cx - 1, lw); ctx.fillRect(x + cx + 5, y2, w - (cx + 5), lw);
        ctx.fillRect(x1, y, lw, cy - 1); ctx.fillRect(x1, y + cy + 5, lw, h - (cy + 5));
        ctx.fillRect(x2, y, lw, cy - 1); ctx.fillRect(x2, y + cy + 5, lw, h - (cy + 5));
        return;
      }

      // 5. Mixed Single / Double lines
      if (ch === '╒' || ch === '╓') {
        ctx.fillRect(lx, ly, w - cx + 1, lw); ctx.fillRect(lx, ly, lw, h - cy + 1);
        if (ch === '╒') ctx.fillRect(lx, ly - 3, w - cx + 1, lw);
        return;
      }
      if (ch === '╕' || ch === '╖') {
        ctx.fillRect(x, ly, cx + 1, lw); ctx.fillRect(lx, ly, lw, h - cy + 1);
        if (ch === '╕') ctx.fillRect(x, ly - 3, cx + 1, lw);
        return;
      }
      if (ch === '╘' || ch === '╙') {
        ctx.fillRect(lx, ly, w - cx + 1, lw); ctx.fillRect(lx, y, lw, cy + 1);
        if (ch === '╘') ctx.fillRect(lx, ly + 3, w - cx + 1, lw);
        return;
      }
      if (ch === '╛' || ch === '╜') {
        ctx.fillRect(x, ly, cx + 1, lw); ctx.fillRect(lx, y, lw, cy + 1);
        if (ch === '╛') ctx.fillRect(x, ly + 3, cx + 1, lw);
        return;
      }
      if (ch === '╞' || ch === '╟') {
        ctx.fillRect(lx, y, lw, h); ctx.fillRect(lx, ly, w - cx + 1, lw);
        return;
      }
      if (ch === '╡' || ch === '╢') {
        ctx.fillRect(lx, y, lw, h); ctx.fillRect(x, ly, cx + 1, lw);
        return;
      }
      if (ch === '╤' || ch === '╥') {
        ctx.fillRect(x, ly, w, lw); ctx.fillRect(lx, ly, lw, h - cy + 1);
        return;
      }
      if (ch === '╧' || ch === '╨') {
        ctx.fillRect(x, ly, w, lw); ctx.fillRect(lx, y, lw, cy + 1);
        return;
      }
      if (ch === '╪' || ch === '╫') {
        ctx.fillRect(x, ly, w, lw); ctx.fillRect(lx, y, lw, h);
        return;
      }

      // 6. Geometric UI shapes
      if (ch === '►') {
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 6);
        ctx.lineTo(x + w - 4, y + cy);
        ctx.lineTo(x + 4, y + h - 6);
        ctx.closePath();
        ctx.fill();
        return;
      }
      if (ch === '◄') {
        ctx.beginPath();
        ctx.moveTo(x + w - 4, y + 6);
        ctx.lineTo(x + 4, y + cy);
        ctx.lineTo(x + w - 4, y + h - 6);
        ctx.closePath();
        ctx.fill();
        return;
      }
      if (ch === '▲') {
        ctx.beginPath();
        ctx.moveTo(x + cx, y + 6);
        ctx.lineTo(x + w - 4, y + h - 6);
        ctx.lineTo(x + 4, y + h - 6);
        ctx.closePath();
        ctx.fill();
        return;
      }
      if (ch === '▼') {
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 6);
        ctx.lineTo(x + w - 4, y + 6);
        ctx.lineTo(x + cx, y + h - 6);
        ctx.closePath();
        ctx.fill();
        return;
      }
      if (ch === '■' || ch === '▪' || ch === '▫') {
        ctx.fillRect(x + 4, y + 8, w - 8, h - 16);
        return;
      }
      if (ch === '•') {
        ctx.beginPath();
        ctx.arc(x + cx, y + cy, 3.5, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      // Generic fallback for any other Box Drawing character
      ctx.fillRect(x, ly, w, lw);
    }

    getPaletteColor(idx) {
      if (typeof idx === 'string' && idx.startsWith('#')) return idx;
      const vgaColors = [
        '#000000', '#0000AA', '#00AA00', '#00AAAA',
        '#AA0000', '#AA00AA', '#AA5500', '#AAAAAA',
        '#555555', '#5555FF', '#55FF55', '#55FFFF',
        '#FF5555', '#FF55FF', '#FFFF55', '#FFFFFF'
      ];
      return vgaColors[idx % 16] || '#AAAAAA';
    }
  }

  window.CyberBBS.Term = new BBSTerminal();
})();


/* --- assets/js/doors.js --- */
/**
 * CYBER BBS — Functional Real Doors
 * Enhanced with In-Terminal Interactive Typing (Zero Pop-ups),
 * Navigation History Stack (ESC always goes back cleanly),
 * Real Live RSS Feeds of Today, Bulletin Board / Forum JSON Engine,
 * Pure-Text GitHub Vault, and World Clocks (Horas Mundiais).
 */
(function() {
  window.CyberBBS = window.CyberBBS || {};

  class BBSDoors {
    constructor() {
      this.currentDoor = null;
      this.pageIndex = 0;
      this.items = [];
      this.activeTimer = null;
    }

    stopActiveTimer() {
      if (this.activeTimer) {
        clearInterval(this.activeTimer);
        this.activeTimer = null;
      }
    }

    renderHeader(title) {
      this.stopActiveTimer();
      const term = window.CyberBBS.Term;
      term.clear();
      term.clearHitRegions();

      const user = window.CyberBBS.Store.currentUser;
      const handle = user ? user.handle : 'GUEST';
      const credits = user ? user.credits : 500;

      const titleStr = ` CYBER BBS // ${title.toUpperCase()} `;
      const leftDashes = Math.max(1, Math.floor((76 - titleStr.length) / 2));
      const rightDashes = Math.max(1, 76 - titleStr.length - leftDashes);
      const topBar = `┌${'─'.repeat(leftDashes)}[${titleStr}]${'─'.repeat(rightDashes)}┐`;

      const infoLeft = ` User: ${handle.substring(0, 12)} · Level: MEMBER`;
      const infoRight = `Credits: ${credits} · Node 1 · 14.4k `;
      const midSpaces = Math.max(1, 78 - infoLeft.length - infoRight.length);
      const midBar = `│${infoLeft}${' '.repeat(midSpaces)}${infoRight}│`;

      term.println(topBar, 11, 0);
      term.println(midBar, 7, 0);
      term.println(`├${'─'.repeat(78)}┤`, 11, 0);
    }

    renderFooter(actions = []) {
      const term = window.CyberBBS.Term;
      term.setCursor(0, 22);
      term.println(`├──────────────────────────────────────────────────────────────────────────────┤`, 11, 0);

      let col = 1;
      actions.forEach(a => {
        const label = `[${a.key}] ${a.label}  `;
        term.print(`[`, 15, 0);
        term.print(`${a.key}`, 14, 0);
        term.print(`] ${a.label}  `, 7, 0);

        term.addHitRegion(col, 23, label.length, 1, `action-${a.key}`, a.action, a.label, a.key);
        col += label.length;
      });

      // Back action via ESC / Q
      const backLabel = `[ESC] Back`;
      term.print(`[`, 15, 0);
      term.print(`ESC`, 12, 0);
      term.print(`] Back`, 7, 0);
      term.addHitRegion(col, 23, backLabel.length, 1, 'action-back', () => window.CyberBBS.App.goBack(), 'Back', 'ESC');

      term.renderStatusBar();
    }

    // ==========================================
    // 1. [N] NEWS & LIVE WIRES (REAL FEEDS OF TODAY)
    // ==========================================
    openNews() {
      window.CyberBBS.App.pushScreen('NEWS_CATS', () => this.renderNewsCategories());
    }

    renderNewsCategories() {
      this.renderHeader('NEWS & LIVE WIRES // SELECT CATEGORY');
      const term = window.CyberBBS.Term;

      const cats = [
        { num: 1, name: 'Technology & Open Source (Hacker News)', url: 'https://hnrss.org/frontpage', src: 'HACKER NEWS' },
        { num: 2, name: 'BBC World News International', url: 'https://feeds.bbci.co.uk/news/world/rss.xml', src: 'BBC WORLD' },
        { num: 3, name: 'Slashdot: News for Nerds & Computing', url: 'https://rss.slashdot.org/Slashdot/slashdotMain', src: 'SLASHDOT' },
        { num: 4, name: 'NASA Space & Science Releases', url: 'https://www.nasa.gov/news-release/feed/', src: 'NASA NEWS' },
        { num: 5, name: 'Ars Technica Lab & IT Analysis', url: 'https://feeds.arstechnica.com/arstechnica/index', src: 'ARS TECHNICA' },
        { num: 6, name: 'Retro Computing Archive Digest (1993-1996)', url: null, src: 'ARCHIVE DIGEST' }
      ];

      term.println(`  #  WIRE CATEGORY                               SOURCE FEED`, 11, 0);
      term.println(`  ─  ──────────────────────────────────────────  ─────────────────────────────`, 8, 0);

      cats.forEach((c, idx) => {
        const row = 5 + idx * 2;
        term.setCursor(2, row);
        term.print(`[${c.num}] `, 14, 0);
        term.print(`${c.name.padEnd(44, ' ')} `, 15, 0);
        term.print(`${c.src}`, 10, 0);

        term.addHitRegion(2, row, 76, 1, `newscat-${c.num}`, () => this.loadNewsCategory(c), c.name, c.num);
      });

      term.setCursor(2, 19);
      term.print(`Type number (1-6) or click to open category. [ESC] Main Menu.`, 14, 0);

      this.renderFooter();
    }

    async loadNewsCategory(cat) {
      window.CyberBBS.App.pushScreen(`NEWS_LIST_${cat.src}`, async () => {
        this.renderHeader(`NEWS // ${cat.src}`);
        const term = window.CyberBBS.Term;
        term.println(`\r\n  Querying live satellite link for ${cat.name}...`, 14, 0);
        term.println(`  Retrieving real current headlines from today...`, 8, 0);

        const net = window.CyberBBS.Net;
        let res;
        if (cat.url) {
          res = await net.fetchRssFeed(cat.url, cat.src);
        } else {
          res = { ok: true, items: net.archiveDigest, isLive: false };
        }

        this.items = res.items || [];
        this.pageIndex = 0;
        this.renderNewsList(cat.src);
      });
    }

    renderNewsList(sourceLabel) {
      this.renderHeader(`NEWS // ${sourceLabel} (LIVE TODAY)`);
      const term = window.CyberBBS.Term;
      const start = this.pageIndex * 7;
      const slice = this.items.slice(start, start + 7);

      term.println(`  #   DATE & TIME       HEADLINE (TODAY'S WIRES)`, 11, 0);
      term.println(`  ──  ────────────────  ──────────────────────────────────────────────────────`, 8, 0);

      slice.forEach((item, idx) => {
        const row = 5 + idx * 2;
        const num = idx + 1;
        const date = (item.date || '').padEnd(16, ' ').substring(0, 16);
        const title = (item.title || '').padEnd(54, ' ').substring(0, 54);

        term.setCursor(2, row);
        term.print(`[${num}] `, 14, 0);
        term.print(`${date}  `, 10, 0);
        term.print(`${title}`, 15, 0);

        term.addHitRegion(2, row, 76, 1, `news-${num}`, () => this.readNewsItem(item, sourceLabel), title, num);
      });

      term.setCursor(2, 20);
      term.print(`Type number (1-${slice.length}) to read article directly.`, 14, 0);

      this.renderFooter([
        { key: 'N', label: 'Next Page', action: () => { if ((this.pageIndex + 1) * 7 < this.items.length) { this.pageIndex++; this.renderNewsList(sourceLabel); } } },
        { key: 'P', label: 'Prev Page', action: () => { if (this.pageIndex > 0) { this.pageIndex--; this.renderNewsList(sourceLabel); } } }
      ]);
    }

    readNewsItem(item, sourceLabel) {
      window.CyberBBS.App.pushScreen('NEWS_DETAIL', () => {
        this.renderHeader('NEWS // DISPATCH DETAIL');
        const term = window.CyberBBS.Term;

        term.println(`\r\n  HEADLINE : ${item.title}`, 15, 0);
        term.println(`  SOURCE   : ${item.source}   DATE: ${item.date}`, 11, 0);
        term.println(`  LINK     : ${item.link || 'Internal Archive'}`, 8, 0);
        term.println(`  ────────────────────────────────────────────────────────────────────────────`, 8, 0);

        const words = (item.summary || item.title).split(' ');
        let line = '  ';
        words.forEach(w => {
          if (line.length + w.length > 74) {
            term.println(line, 7, 0);
            line = '  ' + w + ' ';
          } else {
            line += w + ' ';
          }
        });
        if (line.trim().length > 0) term.println(line, 7, 0);

        this.renderFooter([
          { key: '1', label: 'Back to List', action: () => window.CyberBBS.App.goBack() },
          { key: '2', label: 'Open in Browser', action: () => { if (item.link) window.open(item.link, '_blank'); } },
          { key: '3', label: 'Save as .TXT', action: () => {
            const blob = new Blob([`${item.title}\r\nDate: ${item.date}\r\nSource: ${item.source}\r\n\r\n${item.summary}\r\n`], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'NEWS_ARTICLE.TXT'; a.click();
            URL.revokeObjectURL(url);
            term.showNotice('ARTICLE SAVED AS NEWS_ARTICLE.TXT');
          }}
        ]);
      });
    }

    // ==========================================
    // 2. [B] BULLETIN BOARD / FORUM (JSON ENGINE)
    // ==========================================
    openForum() {
      window.CyberBBS.App.pushScreen('FORUM_CATEGORIES', () => this.renderForumCategories());
    }

    renderForumCategories() {
      this.renderHeader('BULLETIN BOARD // INTERNET FORUMS (JSON DATABASE)');
      const term = window.CyberBBS.Term;

      const store = window.CyberBBS.Store;
      const categories = store.getForumCategories();

      term.println(`  #  BOARD CATEGORY                   THREADS  DESCRIPTION`, 11, 0);
      term.println(`  ─  ───────────────────────────────  ───────  ───────────────────────────────`, 8, 0);

      categories.forEach((cat, idx) => {
        const row = 5 + idx * 2;
        const count = store.getForumThreads(cat.id).length;

        term.setCursor(2, row);
        term.print(`[${cat.num}] `, 14, 0);
        term.print(`${cat.title.padEnd(31, ' ')}  `, 15, 0);
        term.print(`${count.toString().padEnd(7, ' ')}  `, 10, 0);
        term.print(`${cat.desc.substring(0, 31)}`, 7, 0);

        term.addHitRegion(2, row, 76, 1, `forum-cat-${cat.num}`, () => this.openForumCategory(cat), cat.title, cat.num);
      });

      term.setCursor(2, 19);
      term.print(`Type number (1-${categories.length}) or use arrows+Enter to open board.`, 14, 0);

      this.renderFooter([
        { key: 'E', label: 'Export JSON', action: () => {
          store.exportForumJson();
          term.showNotice('BULLETIN_BOARD_FORUM.JSON EXPORTED!');
        }},
        { key: 'I', label: 'Import JSON', action: () => {
          term.promptInline('IMPORT FORUM JSON', 'Paste JSON text:', '', (input) => {
            if (input) {
              const res = store.importForumJson(input);
              if (res.ok) {
                term.showNotice(res.message);
                this.renderForumCategories();
              } else {
                term.showNotice(res.error);
              }
            }
          }, () => this.renderForumCategories());
        }}
      ]);
    }

    openForumCategory(cat) {
      window.CyberBBS.App.pushScreen(`FORUM_CAT_${cat.id}`, () => this.renderForumCategoryThreads(cat));
    }

    renderForumCategoryThreads(cat) {
      this.renderHeader(`FORUM // ${cat.title}`);
      const term = window.CyberBBS.Term;

      const store = window.CyberBBS.Store;
      const threads = store.getForumThreads(cat.id);

      term.println(`  #   REPLIES  AUTHOR           TITLE / TOPIC`, 11, 0);
      term.println(`  ──  ───────  ───────────────  ──────────────────────────────────────────────`, 8, 0);

      if (threads.length === 0) {
        term.println(`\r\n  NO THREADS IN THIS BOARD YET. PRESS [N] TO CREATE THE FIRST ONE!`, 14, 0);
      } else {
        threads.slice(0, 7).forEach((t, idx) => {
          const row = 5 + idx * 2;
          const num = idx + 1;
          const replies = `${(t.posts?.length || 1) - 1} rpls`.padEnd(7, ' ');
          const author = (t.author || 'ANON').padEnd(15, ' ').substring(0, 15);
          const tagsStr = t.tags && t.tags.length > 0 ? `[${t.tags.join(',')}] ` : '';
          const title = (tagsStr + t.title).padEnd(46, ' ').substring(0, 46);

          term.setCursor(2, row);
          term.print(`[${num}] `, 14, 0);
          term.print(`${replies}  `, 10, 0);
          term.print(`${author}  `, 7, 0);
          term.print(`${title}`, 15, 0);

          term.addHitRegion(2, row, 76, 1, `thread-${num}`, () => this.readForumThread(t, cat), t.title, num);
        });
      }

      term.setCursor(2, 20);
      term.print(`Type number (1-${Math.min(7, threads.length)}) to read thread. [ESC] Back.`, 14, 0);

      this.renderFooter([
        { key: 'N', label: 'New Thread', action: () => this.createForumThread(cat) }
      ]);
    }

    readForumThread(thread, cat) {
      window.CyberBBS.App.pushScreen(`FORUM_THREAD_${thread.id}`, () => {
        this.renderHeader(`FORUM // THREAD #${thread.id}`);
        const term = window.CyberBBS.Term;

        term.println(`\r\n  TITLE   : ${thread.title}`, 15, 0);
        term.println(`  BOARD   : ${cat.title}    TAGS: [${(thread.tags || []).join(', ')}]`, 11, 0);
        term.println(`  ────────────────────────────────────────────────────────────────────────────`, 8, 0);

        (thread.posts || []).slice(0, 4).forEach((p) => {
          const badge = p.role === 'SYSOP' ? '[SYSOP]' : '[MEMBER]';
          term.println(`  #${p.postNum} by ${p.author} ${badge} on ${p.date}:`, 14, 0);

          const lines = p.body.split('\n');
          lines.slice(0, 2).forEach(l => {
            term.println(`    ${l.trim()}`, 7, 0);
          });
          term.println(`  · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · `, 8, 0);
        });

        this.renderFooter([
          { key: '1', label: 'Reply to Thread', action: () => this.replyToForumThread(thread, cat) },
          { key: '2', label: 'Back to Threads', action: () => window.CyberBBS.App.goBack() }
        ]);
      });
    }

    createForumThread(cat) {
      const term = window.CyberBBS.Term;

      // In-Terminal Step 1: Title
      term.promptInline('NEW THREAD (1/3)', 'Enter Thread Title:', '', (title) => {
        if (!title) { this.renderForumCategoryThreads(cat); return; }

        // In-Terminal Step 2: Tags
        term.promptInline('NEW THREAD (2/3)', 'Enter Tags (e.g. dos, hardware):', 'retro', (tags) => {

          // In-Terminal Step 3: Body
          term.promptInline('NEW THREAD (3/3)', 'Enter Thread Content:', '', (body) => {
            if (!body) { this.renderForumCategoryThreads(cat); return; }

            const user = window.CyberBBS.Store.currentUser;
            const author = user ? user.handle : 'GUEST';
            const tagArray = tags ? tags.split(',').map(s => s.trim().toLowerCase()) : [];

            const newThread = window.CyberBBS.Store.createThread(cat.id, title, author, body, tagArray);
            term.showNotice('THREAD POSTED TO FORUM JSON DATABASE!');
            if (window.CyberBBS.Audio) window.CyberBBS.Audio.playBell();

            // Echo Bot reply after 10s
            setTimeout(() => {
              const bots = ['ACID_BURN', 'ZERO_COOL', 'LORD_NIKON', 'PHANTOM_PHREAK'];
              const botName = bots[Math.floor(Math.random() * bots.length)];
              const botReplies = [
                'Excellent topic! I have been testing this on my 486 machine recently.',
                'Saved this post to my local diskette. Great information!',
                'Agreed with the original post. The baud rate makes all the difference.',
                'Checked the repository in GitHub Vault for this — works flawlessly!'
              ];
              window.CyberBBS.Store.replyToThread(newThread.id, botName, botReplies[Math.floor(Math.random() * botReplies.length)]);
              window.CyberBBS.Term.showNotice(`*** BOT ${botName} REPLIED TO THREAD #${newThread.id}! ***`);
              if (window.CyberBBS.Audio) window.CyberBBS.Audio.playBell();
            }, 10000);

            this.renderForumCategoryThreads(cat);
          }, () => this.renderForumCategoryThreads(cat));
        }, () => this.renderForumCategoryThreads(cat));
      }, () => this.renderForumCategoryThreads(cat));
    }

    replyToForumThread(thread, cat) {
      const term = window.CyberBBS.Term;
      term.promptInline('REPLY TO THREAD', `Enter Reply to "${thread.title.substring(0, 30)}...":`, '', (body) => {
        if (!body) { this.readForumThread(thread, cat); return; }

        const user = window.CyberBBS.Store.currentUser;
        const author = user ? user.handle : 'GUEST';

        window.CyberBBS.Store.replyToThread(thread.id, author, body);
        term.showNotice('REPLY POSTED TO FORUM!');
        if (window.CyberBBS.Audio) window.CyberBBS.Audio.playBell();

        this.readForumThread(thread, cat);
      }, () => this.readForumThread(thread, cat));
    }

    // ==========================================

    // ==========================================
    openFiles() {

    }

    renderFileAreas() {
      this.renderHeader('FILE AREAS // NUMBERED CATALOG');
      const term = window.CyberBBS.Term;

      const areas = [
        { num: 1, code: '01', name: 'SYSOP TEXTS & GUIDES', count: 12, desc: 'BBS manuals, phreaking, and computing docs' },
        { num: 2, code: '02', name: 'ANSI ART & ART PACKS', count: 24, desc: 'Original ANSI/ASCII releases and viewers' },
        { num: 3, code: '03', name: 'DOS UTILITIES & TOOLS', count: 18, desc: 'Archivers (PKZIP), file managers, disk tools' },
        { num: 4, code: '04', name: 'DEMOSCENE & RETRO DEMOS', count: 15, desc: 'Historic PC demoscene releases' },
        { num: 5, code: '05', name: 'DOCS & PROJECT GUTENBERG', count: 30, desc: 'Ebooks and public-domain literature' },
        { num: 6, code: '06', name: 'GITHUB RELEASES MIRROR', count: 20, desc: 'Open-source software binaries' },

        term.print(`${a.count.toString().padEnd(5, ' ')}  `, 10, 0);
        term.print(`${a.desc}`, 7, 0);

        term.addHitRegion(2, row, 76, 1, `area-${a.num}`, () => this.browseFileArea(a), a.name, a.num);
      });

      term.setCursor(2, 20);

      this.renderFooter([

        }}
      ]);

    async browseFileArea(area) {
      window.CyberBBS.App.pushScreen(`FILE_AREA_${area.code}`, async () => {
        this.renderHeader(`FILES // AREA ${area.code} : ${area.name}`);
        const term = window.CyberBBS.Term;

        let files = [
          { name: 'PKZ204G.EXE', size: 202574, cost: 20, desc: 'PKZIP 2.04g standard DOS compression tool' },
          { name: 'TELEDISK.ZIP', size: 145120, cost: 15, desc: 'TeleDisk 2.11 raw diskette copier and imager' },
          { name: 'ACID95.ANS', size: 8420, cost: 2, desc: 'Acid Productions 1995 demo art screen' },
          { name: 'JARGON3.TXT', size: 685400, cost: 68, desc: 'The Hacker Jargon File v3.0 by Eric S. Raymond' }
        ];

        if (area.code === '07') {
          const userUploads = await window.CyberBBS.Store.getUploadFiles();
          if (userUploads && userUploads.length > 0) {
            files = userUploads.map(u => ({
              name: u.name,
              size: u.size,
              cost: 0,
              desc: `User upload by ${u.uploader} on ${u.date}`,
              blobData: u.data
            }));
          } else {
            files = [];
          }
        }

        if (files.length === 0) {
          term.println(`\r\n  NO FILES FOUND IN THIS AREA. PRESS [U] TO UPLOAD ONE!`, 14, 0);
        } else {
          term.println(`  #  FILENAME       SIZE (BYTES)  CREDITS  DESCRIPTION`, 11, 0);
          term.println(`  ─  ─────────────  ────────────  ───────  ───────────────────────────────────`, 8, 0);

          files.forEach((f, idx) => {
            const row = 5 + idx * 2;
            const num = idx + 1;
            const kb = `${Math.ceil(f.size / 1024)} KB`.padEnd(12, ' ');
            const cost = `${f.cost} CR`.padEnd(7, ' ');

            term.setCursor(2, row);
            term.print(`[${num}] `, 14, 0);
            term.print(`${f.name.padEnd(14, ' ')} `, 15, 0);

            term.print(`${cost} `, 10, 0);

    confirmDownload(file) {
      window.CyberBBS.App.pushScreen('DOWNLOAD_CONFIRM', () => {
        this.renderHeader('DOWNLOAD CONFIRMATION');
        const term = window.CyberBBS.Term;

        term.println(`\r\n  File Name     : ${file.name}`, 15, 0);
        term.println(`  File Size     : ${file.size} bytes (${Math.ceil(file.size / 1024)} KB)`, 7, 0);
        term.println(`  Download Cost : ${file.cost} credits`, 10, 0);
        term.println(`  Your Credits  : ${window.CyberBBS.Store.currentUser?.credits || 500} credits`, 11, 0);
        term.println(`  Protocol      : ZMODEM-90 Streaming (CRC-32 Error Correction)`, 14, 0);
        term.println(`  ────────────────────────────────────────────────────────────────────────────`, 8, 0);
        term.println(`\r\n  Initiate ZMODEM download now?`, 15, 0);

        this.renderFooter([
          { key: '1', label: 'Start ZMODEM Transfer', action: () => this.startZmodemDownload(file) },
          { key: '2', label: 'Back to Files', action: () => window.CyberBBS.App.goBack() }
        ]);
      });
    }

    startZmodemDownload(file) {
      this.renderHeader(`ZMODEM RECEIVE // ${file.name}`);
      const term = window.CyberBBS.Term;
      const audio = window.CyberBBS.Audio;

      let progress = 0;
      const totalBlocks = Math.max(10, Math.ceil(file.size / 1024));

      const timer = setInterval(() => {
        progress += 10;
        const currentBlock = Math.min(totalBlocks, Math.ceil((progress / 100) * totalBlocks));

        if (audio) audio.playTransferTick();

        term.setCursor(2, 6);
        term.println(`  Initiating ZMODEM handshake with remote node...`, 10, 0);
        term.println(`  Receiving: ${file.name.padEnd(20, ' ')} Block ${currentBlock}/${totalBlocks} · CRC-32: OK`, 14, 0);

        const barWidth = 50;
        const filled = Math.floor((progress / 100) * barWidth);
        const bar = '▓'.repeat(filled) + '░'.repeat(barWidth - filled);

        term.setCursor(2, 9);
        term.println(`  Progress: [${bar}] ${progress}%`, 11, 0);
        term.println(`  Baud Rate: 14,400 bps  ·  Throughput: 1,420 cps  ·  Errors: 0`, 7, 0);

        if (progress >= 100) {
          clearInterval(timer);
          if (audio) audio.playBell();

          window.CyberBBS.Store.recordTransfer(file.size, false);

          term.setCursor(2, 13);
          term.println(`  ==============================================================`, 10, 0);
          term.println(`  *** TRANSFER COMPLETE — CRC-32 VERIFIED (0 ERRORS) ***`, 10, 0);
          term.println(`  File saved to your browser downloads folder!`, 15, 0);

    openWorldClock() {
      window.CyberBBS.App.pushScreen('WORLD_CLOCKS', () => {
        this.renderHeader('WORLD CLOCKS // HORAS MUNDIAIS TELEMETRY');
        const term = window.CyberBBS.Term;

        const renderClocks = () => {
          term.setCursor(2, 4);
          term.println(`  GLOBAL TIMEZONE TELEMETRY MATRIX (REAL-TIME TICKING)`, 14, 0);
          term.println(`  ────────────────────────────────────────────────────────────────────────────`, 8, 0);

          const now = new Date();
          const tzList = [
            { city: 'São Paulo / Brasília', tz: 'America/Sao_Paulo', code: 'BRT (UTC-3)' },
            { city: 'New York / Boston', tz: 'America/New_York', code: 'EST (UTC-5)' },
            { city: 'Silicon Valley / Seattle', tz: 'America/Los_Angeles', code: 'PST (UTC-8)' },
            { city: 'London / Greenwich', tz: 'Europe/London', code: 'GMT (UTC+0)' },
            { city: 'Paris / Berlin / Frankfurt', tz: 'Europe/Berlin', code: 'CET (UTC+1)' },
            { city: 'Tokyo / Kyoto', tz: 'Asia/Tokyo', code: 'JST (UTC+9)' },
            { city: 'Sydney / Melbourne', tz: 'Australia/Sydney', code: 'AEST (UTC+10)' }
          ];

          tzList.forEach((item, idx) => {
            const row = 6 + idx * 2;
            try {
              const timeStr = now.toLocaleTimeString('en-US', { timeZone: item.tz, hour12: false });
              const dateStr = now.toLocaleDateString('en-US', { timeZone: item.tz, month: 'short', day: '2-digit' });
              const hour = parseInt(timeStr.split(':')[0], 10);
              const isDay = hour >= 6 && hour < 19;
              const sunMoon = isDay ? '☼ DAY  ' : '☽ NIGHT';

              term.setCursor(2, row);
              term.print(`  ${item.city.padEnd(28, ' ')} `, 15, 0);
              term.print(`${item.code.padEnd(14, ' ')} `, 11, 0);
              term.print(`${dateStr}  `, 7, 0);
              term.print(`${timeStr}  `, 14, 0);
              term.print(`${sunMoon}`, isDay ? 14 : 9, 0);
            } catch (e) {}
          });

/* --- assets/js/app.js --- */
/**
 * CYBER BBS — Master Application Controller & Navigation Stack
 * Handles 100% In-Terminal Typing (Zero Pop-ups), Reliable ESC Back Navigation,
 * Numeric Quick-Jump, Arrow Pre-Selection, and Full HD Screen Presentation.
 */
(function() {
  window.CyberBBS = window.CyberBBS || {};

  class BBSApp {
    constructor() {
      this.state = 'BOOT';
      this.history = []; // Navigation stack for reliable ESC back navigation
      this.currentRenderFn = null;

      this.themes = ['theme-vga', 'theme-green', 'theme-amber', 'theme-paper', 'theme-flat'];
      this.currentThemeIdx = 0;
      this.crtEnabled = true;
      this.aspect169 = false;

      this.numKeyBuffer = '';
      this.numKeyTimer = null;
    }

    init() {
      window.CyberBBS.Term.init('term-canvas', 'mouse-overlay');
      this.setupKeyboard();
      this.setupBezelButtons();
      this.setupFileUpload();

      // Start Boot Sequence
      this.bootSequence();
    }

    pushScreen(screenName, renderFn) {
      if (this.currentRenderFn && this.state !== 'BOOT') {
        this.history.push({ state: this.state, render: this.currentRenderFn });
      }
      this.state = screenName;
      this.currentRenderFn = renderFn;
      renderFn();
    }

    goBack() {
      // 1. If in-terminal input prompt is active, cancel it
      const term = window.CyberBBS.Term;
      if (term && term.activePrompt) {
        const cancelCb = term.activePrompt.onCancel;
        term.activePrompt = null;
        term.redrawAll();
        if (typeof cancelCb === 'function') cancelCb();
        return;
      }

      // 2. Stop any active timers (e.g. World Clocks)
      if (window.CyberBBS.Doors && window.CyberBBS.Doors.stopActiveTimer) {
        window.CyberBBS.Doors.stopActiveTimer();
      }

      // 3. Pop from navigation history
      if (this.history.length > 0) {
        const prev = this.history.pop();
        this.state = prev.state;
        this.currentRenderFn = prev.render;
        if (typeof prev.render === 'function') {
          prev.render();
          return;
        }
      }

      // 4. Fallback to Main Menu if not already there
      if (this.state !== 'MAIN' && this.state !== 'BOOT') {
        this.showMainMenu();
      }
    }

    setupKeyboard() {
      window.addEventListener('keydown', (e) => {
        const term = window.CyberBBS.Term;

        // If in-terminal prompt is active, route all input directly to it!
        if (term && term.activePrompt) {
          e.preventDefault();
          term.handlePromptKey(e);
          return;
        }

        // Fullscreen hotkey: F11 or Alt+Enter
        if (e.key === 'F11' || (e.altKey && e.key === 'Enter')) {
          e.preventDefault();
          this.toggleFullscreen();
          return;
        }

        // ESC hotkey: ALWAYS GO BACK RELIABLY!
        if (e.key === 'Escape') {
          e.preventDefault();
          if (this.state === 'HANDSHAKE') {
            window.CyberBBS.Audio.skipHandshake(() => this.showBanner());
          } else {
            this.goBack();
          }
          return;
        }

        // Mechanical key click sound
        if (!e.ctrlKey && !e.altKey && e.key.length === 1) {
          if (window.CyberBBS.Audio) window.CyberBBS.Audio.playKeyClick();
        }

        // 1. Direct Numeric Quick-Jump
        if (/^[0-9]$/.test(e.key)) {
          e.preventDefault();
          this.handleNumericInput(e.key);
          return;
        }

        // 2. Arrow Key Pre-Selection
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'Tab') {
          e.preventDefault();
          term.selectNextRegion(true);
          return;
        }
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
          e.preventDefault();
          term.selectNextRegion(false);
          return;
        }

        // 3. Enter Key Activates Pre-Selected Option
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (this.state === 'READY_TO_DIAL') {
            this.startDialing();
          } else if (term.activeRegionIdx >= 0) {
            term.activateCurrentRegion();
          }
          return;
        }

        // 4. Letter hotkeys
        if (e.key.length === 1 && !e.ctrlKey && !e.altKey) {
          const k = e.key.toUpperCase();
          if (term.triggerByNumKey(k)) {
            return;
          }

          if (this.state === 'MAIN') {
            if (k === 'N') window.CyberBBS.Doors.openNews();
            else if (k === 'B') window.CyberBBS.Doors.openForum();
            else if (k === 'F') window.CyberBBS.Doors.openFiles();
            else if (k === 'P') window.CyberBBS.Doors.openPhotos();
            else if (k === 'G') window.CyberBBS.Doors.openGitHub();
            else if (k === 'D') window.CyberBBS.Doors.openGames();
            else if (k === 'H' || k === 'W') window.CyberBBS.Doors.openWorldClock();
            else if (k === 'C') window.CyberBBS.Doors.openChat();
            else if (k === 'A') this.showAnsiGallery();
            else if (k === 'O') this.showOneLiners();
            else if (k === 'S') this.showSettings();
            else if (k === 'X' || k === 'Q') this.showLogoff();
            else if (k === '?') this.showHelp();
          }
        }
      });
    }

    handleNumericInput(digit) {
      if (this.numKeyTimer) clearTimeout(this.numKeyTimer);
      this.numKeyBuffer += digit;

      const term = window.CyberBBS.Term;
      const matched = term.hitRegions.find(r => r.numKey === this.numKeyBuffer);

      if (matched && typeof matched.action === 'function') {
        const hasLongerMatches = term.hitRegions.some(r => r.numKey && r.numKey !== this.numKeyBuffer && r.numKey.startsWith(this.numKeyBuffer));
        if (!hasLongerMatches || this.numKeyBuffer.length >= 2) {
          this.numKeyBuffer = '';
          matched.action();
          return;
        }
      }

      this.numKeyTimer = setTimeout(() => {
        const singleMatch = term.hitRegions.find(r => r.numKey === this.numKeyBuffer);
        if (singleMatch && typeof singleMatch.action === 'function') {
          singleMatch.action();
        }
        this.numKeyBuffer = '';
      }, 250);
    }

    setupBezelButtons() {
      document.getElementById('btn-fullscreen')?.addEventListener('click', () => this.toggleFullscreen());
      document.getElementById('btn-mute')?.addEventListener('click', () => this.toggleMute());
      document.getElementById('btn-crt')?.addEventListener('click', () => this.toggleCrt());
      document.getElementById('btn-theme')?.addEventListener('click', () => this.cycleTheme());
      document.getElementById('btn-aspect')?.addEventListener('click', () => this.toggleAspectRatio());

      const volSlider = document.getElementById('vol-slider');
      if (volSlider) {
        volSlider.addEventListener('input', (e) => {
          if (window.CyberBBS.Audio) window.CyberBBS.Audio.setVolume(parseFloat(e.target.value));
        });
      }
    }

    setupFileUpload() {
      const input = document.getElementById('bbs-file-input');
      if (!input) return;

      input.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async () => {
          const store = window.CyberBBS.Store;
          await store.saveUploadFile(file.name.toUpperCase(), file.size, file.type, reader.result);
          window.CyberBBS.Term.showNotice(`FILE ${file.name.toUpperCase()} UPLOADED! REWARDED CREDITS.`);
          if (window.CyberBBS.Audio) window.CyberBBS.Audio.playBell();
          window.CyberBBS.Doors.browseFileArea({ code: '07', name: 'YOUR UPLOADS (LOCAL SANDBOX)' });
        };
        reader.readAsArrayBuffer(file);
      });
    }

    toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('btn-fullscreen')?.classList.add('active');
      } else {
        document.exitFullscreen().catch(() => {});
        document.getElementById('btn-fullscreen')?.classList.remove('active');
      }
    }

    toggleMute() {
      const audio = window.CyberBBS.Audio;
      if (!audio) return;
      const isMuted = audio.toggleMute();
      const btn = document.getElementById('btn-mute');
      if (btn) {
        btn.textContent = isMuted ? '🔇 SOUND: OFF' : '🔊 SOUND: ON';
        btn.classList.toggle('active', !isMuted);
      }
    }

    toggleCrt() {
      this.crtEnabled = !this.crtEnabled;
      const frame = document.getElementById('crt-frame');
      const btn = document.getElementById('btn-crt');
      if (frame) {
        frame.classList.toggle('scanlines', this.crtEnabled);
        frame.classList.toggle('vignette', this.crtEnabled);
      }
      if (btn) btn.classList.toggle('active', this.crtEnabled);
    }

    cycleTheme() {
      const housing = document.getElementById('monitor-housing');
      if (!housing) return;

      housing.classList.remove(...this.themes);
      this.currentThemeIdx = (this.currentThemeIdx + 1) % this.themes.length;
      const theme = this.themes[this.currentThemeIdx];
      housing.classList.add(theme);

      const themeNames = ['VGA COLOR', 'GREEN CRT', 'AMBER CRT', 'PAPER WHITE', 'FLAT LCD'];
      const btn = document.getElementById('btn-theme');
      if (btn) btn.textContent = `🎨 ${themeNames[this.currentThemeIdx]}`;
    }

    toggleAspectRatio() {
      this.aspect169 = !this.aspect169;
      const housing = document.getElementById('monitor-housing');
      if (housing) {
        housing.classList.toggle('aspect-16-9', this.aspect169);
        housing.classList.toggle('aspect-4-3', !this.aspect169);
      }
      const btn = document.getElementById('btn-aspect');
      if (btn) btn.textContent = this.aspect169 ? '📐 RATIO: 16:9' : '📐 RATIO: 4:3';
    }

    // ==========================================
    // BOOT & SESSION FLOW

      const menuItems = [
